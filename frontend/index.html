<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Recommender</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 17px; }

    /* ── Palette ──────────────────────────────────────────────
       --bg:        #fdf0f3  pale blush pink background
       --surface:   #fff5f7  card / panel surface
       --surface2:  #fce8ed  deeper surface / hover
       --accent:    #c9637a  rose — primary actions
       --accent2:   #a0456e  deep rose — hover states
       --mauve:     #b07a9e  mauve — secondary accents
       --gold:      #d4956a  warm amber — stars / highlights
       --text:      #3b2030  deep wine — primary text
       --muted:     #9a7080  muted rose-grey — secondary text
       --border:    #f0d0da  soft pink border
    ──────────────────────────────────────────────────────── */

    :root {
      --bg:       #fdf0f3;
      --surface:  #fff5f7;
      --surface2: #fce8ed;
      --accent:   #c9637a;
      --accent2:  #a0456e;
      --mauve:    #b07a9e;
      --gold:     #d4956a;
      --text:     #3b2030;
      --muted:    #9a7080;
      --border:   #f0d0da;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .container { max-width: 1100px; margin: 0 auto; }

    /* ── Header ── */
    header { text-align: center; margin-bottom: 2.5rem; }
    header .emoji { font-size: 3rem; }
    header h1 {
      font-size: 2.2rem; font-weight: 700;
      color: var(--accent2);
      margin-top: 0.4rem;
      letter-spacing: -0.5px;
      font-family: 'Playfair Display', serif;
    }
    header p { color: var(--muted); margin-top: 0.5rem; font-size: 1rem; }

    /* ── Input box ── */
    .input-box {
      background: var(--surface);
      border-radius: 20px;
      padding: 1.5rem;
      margin-bottom: 1rem;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(180,80,100,0.07);
    }

    /* ── Moods toggle ── */
    .btn-moods {
      background: var(--surface2);
      color: var(--accent2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.4rem 1rem;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: inherit;
      font-weight: 500;
      margin-bottom: 1rem;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-moods:hover { background: var(--border); border-color: var(--accent); }

    /* ── Chips ── */
    .chips { display: none; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.2rem; }
    .chips.open { display: flex; }

    .chip {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.35rem 0.85rem;
      cursor: pointer;
      font-size: 0.83rem;
      font-family: inherit;
      transition: all 0.2s;
    }
    .chip:hover { background: var(--border); border-color: var(--accent); }
    .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* ── Search row ── */
    .search-row { display: flex; gap: 0.75rem; }

    input[type="text"] {
      flex: 1;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    input[type="text"]::placeholder { color: var(--muted); }
    input[type="text"]:focus { border-color: var(--accent); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0.75rem 1.5rem;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      font-family: inherit;
      white-space: nowrap;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-primary:hover { background: var(--accent2); transform: translateY(-1px); }
    .btn-primary:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; transform: none; }

    /* ── Mood label ── */
    #mood-label {
      text-align: center;
      color: var(--muted);
      margin: 1.2rem 0 0.5rem;
      font-size: 0.95rem;
    }
    #mood-label span { color: var(--accent2); font-weight: 600; }

    #error { color: #c0392b; text-align: center; margin-top: 1rem; font-size: 0.9rem; }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.2rem;
      margin-top: 1.5rem;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      box-shadow: 0 2px 12px rgba(180,80,100,0.06);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 28px rgba(180,80,100,0.13);
    }

    .card-cover {
      height: 185px;
      background: linear-gradient(135deg, var(--accent), var(--mauve));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      background-size: cover;
      background-position: center;
    }

    .card-body { padding: 1rem; flex: 1; display: flex; flex-direction: column; gap: 0.4rem; }

    .card-title { font-size: 0.98rem; font-weight: 600; line-height: 1.35; color: var(--text); }
    .card-author { font-size: 0.8rem; color: var(--muted); }

    .stars { color: var(--gold); font-size: 0.8rem; }
    .rating-num { color: var(--muted); font-size: 0.74rem; margin-left: 0.3rem; }

    .genre-tag {
      background: #fce0e8;
      color: var(--accent2);
      border-radius: 6px;
      padding: 0.2rem 0.55rem;
      font-size: 0.71rem;
      font-weight: 500;
      align-self: flex-start;
    }

    .card-desc { font-size: 0.81rem; color: var(--muted); line-height: 1.55; margin-top: 0.3rem; }

    .explain-box {
      background: #fff0f3;
      border-radius: 8px;
      padding: 0.75rem;
      font-size: 0.81rem;
      line-height: 1.6;
      color: var(--text);
      border-left: 3px solid var(--accent);
      margin-top: 0.5rem;
      display: none;
    }

    .btn-explain {
      margin-top: auto;
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--accent);
      cursor: pointer;
      font-size: 0.81rem;
      padding: 0.5rem;
      font-family: inherit;
      font-weight: 500;
      transition: all 0.2s;
      width: 100%;
    }
    .btn-explain:hover { background: var(--surface2); border-color: var(--accent); }
    .btn-explain:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Card action row ── */
    .card-actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .btn-read, .btn-skip {
      flex: 1;
      border-radius: 8px;
      padding: 0.4rem 0.5rem;
      font-size: 0.75rem;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      border: 1.5px solid var(--border);
      transition: all 0.2s;
    }
    .btn-read  { background: #f0faf4; color: #2e7d52; border-color: #b2dfcc; }
    .btn-read:hover  { background: #d6f5e3; }
    .btn-skip  { background: #fff5f5; color: #c0392b; border-color: #f5c0c0; }
    .btn-skip:hover  { background: #fde8e8; }
    .btn-read.done, .btn-skip.done { opacity: 0.45; cursor: default; }

    /* ── History panel ── */
    .history-toggle {
      position: fixed;
      bottom: 1.5rem; right: 1.5rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 0.6rem 1.2rem;
      font-size: 0.85rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(180,80,100,0.3);
      z-index: 50;
      transition: background 0.2s, transform 0.2s;
    }
    .history-toggle:hover { background: var(--accent2); transform: translateY(-2px); }

    .history-panel {
      display: none;
      position: fixed;
      bottom: 5rem; right: 1.5rem;
      width: 320px;
      max-height: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(180,80,100,0.15);
      z-index: 50;
      overflow: hidden;
      flex-direction: column;
      animation: popIn 0.2s ease;
    }
    .history-panel.open { display: flex; }
    .history-header {
      padding: 1rem 1.2rem 0.75rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .history-header h3 { font-size: 0.95rem; font-weight: 600; color: var(--text); }
    .btn-clear-history {
      background: none; border: none;
      color: var(--muted); font-size: 0.75rem;
      cursor: pointer; font-family: inherit;
      transition: color 0.2s;
    }
    .btn-clear-history:hover { color: #c0392b; }
    .history-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }
    .history-tab {
      flex: 1; padding: 0.5rem;
      font-size: 0.8rem; font-family: inherit;
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-weight: 500;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .history-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .history-list {
      overflow-y: auto; flex: 1; padding: 0.75rem;
      display: flex; flex-direction: column; gap: 0.5rem;
    }
    .history-item {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.5rem 0.6rem;
      background: var(--surface2);
      border-radius: 8px; font-size: 0.8rem;
    }
    .history-item-cover {
      width: 32px; height: 40px; border-radius: 4px;
      background: linear-gradient(135deg, var(--accent), var(--mauve));
      flex-shrink: 0; background-size: cover; background-position: center;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
    }
    .history-item-info { flex: 1; min-width: 0; }
    .history-item-title { font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-item-author { color: var(--muted); font-size: 0.73rem; }
    .btn-remove-history {
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 0.85rem; flex-shrink: 0;
      transition: color 0.2s;
    }
    .btn-remove-history:hover { color: #c0392b; }
    .history-empty { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 1.5rem 0; }

    /* ── Section title ── */
    .section-title {
      font-size: 1.15rem; font-weight: 600;
      margin-top: 2rem; color: var(--text);
    }

    /* ── Shuffle / Lucky buttons ── */
    .btn-shuffle {
      background: var(--surface);
      color: var(--accent2);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 0.6rem 1.4rem;
      cursor: pointer;
      font-size: 0.88rem;
      font-family: inherit;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-shuffle:hover { background: var(--surface2); border-color: var(--accent); transform: translateY(-1px); }
    .btn-shuffle:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(59,32,48,0.55);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border-radius: 20px;
      padding: 2rem;
      max-width: 480px;
      width: 90%;
      position: relative;
      border: 1px solid var(--border);
      box-shadow: 0 20px 60px rgba(180,80,100,0.18);
      animation: popIn 0.25s ease;
      max-height: 90vh;
      overflow-y: auto;
    }
    @keyframes popIn {
      from { transform: scale(0.88); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }

    .modal-close {
      position: absolute;
      top: 1rem; right: 1rem;
      background: var(--surface2); border: none;
      color: var(--muted); font-size: 1rem;
      cursor: pointer; border-radius: 50%;
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .modal-close:hover { background: var(--border); color: var(--text); }

    .modal-cover {
      width: 100%; height: 200px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--mauve));
      display: flex; align-items: center; justify-content: center;
      font-size: 4rem;
      background-size: cover; background-position: center;
      margin-bottom: 1.2rem;
    }
    .modal-title  { font-size: 1.25rem; font-weight: 700; color: var(--text); margin-bottom: 0.3rem; }
    .modal-author { color: var(--muted); font-size: 0.88rem; margin-bottom: 0.6rem; }
    .modal-genre  {
      background: #fce0e8; color: var(--accent2);
      border-radius: 6px; padding: 0.2rem 0.6rem;
      font-size: 0.74rem; font-weight: 500;
      display: inline-block; margin-bottom: 0.8rem;
    }
    .modal-stars  { color: var(--gold); font-size: 0.85rem; margin-bottom: 0.8rem; }
    .modal-desc   { font-size: 0.84rem; color: var(--muted); line-height: 1.6; margin-bottom: 1rem; }
    .modal-explain {
      background: #fff0f3; border-left: 3px solid var(--accent);
      border-radius: 8px; padding: 0.75rem;
      font-size: 0.82rem; line-height: 1.6; color: var(--text);
      margin-bottom: 1rem; display: none;
    }
    .modal-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .modal-actions button { flex: 1; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="emoji">📚</div>
    <h1>Book Recommender</h1>
    <p>Tell us how you're feeling and we'll find your next great read</p>
  </header>

  <div class="input-box">
    <button class="btn-moods" id="moods-toggle" onclick="toggleMoods()">🎭 Moods ▾</button>
    <div class="chips" id="chips"></div>
    <div class="search-row">
      <input type="text" id="mood-input" placeholder="Or describe how you're feeling in your own words..." />
      <button class="btn-primary" id="search-btn" onclick="search()">Find Books ✨</button>
    </div>
  </div>

  <div id="error"></div>
  <div id="mood-label"></div>
  <div id="results-title"></div>
  <div id="shuffle-row" style="display:none; margin-top:1.2rem; gap:0.75rem; justify-content:center; flex-wrap:wrap;">
    <button class="btn-shuffle" id="shuffle-btn" onclick="shuffle()">🔀 Show different books</button>
    <button class="btn-shuffle" id="lucky-btn" onclick="feelingLucky()">🎲 Just pick one for me</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
  const API = "http://localhost:8000";
  let currentText = "";
  let currentMood = "";
  let currentOffset = 0;

  const CHIPS = [
    { label: "😊 Happy",       value: "I'm feeling happy and want something fun" },
    { label: "😢 Sad",         value: "I'm feeling sad and need some comfort" },
    { label: "🌍 Adventurous", value: "I want something adventurous and exciting" },
    { label: "💕 Romantic",    value: "I'm in a romantic mood" },
    { label: "🔍 Curious",     value: "I'm curious and want to learn something new" },
    { label: "😱 Thrilled",    value: "I want something scary and full of horror and suspense" },
    { label: "💪 Motivated",   value: "I need motivation and inspiration" },
    { label: "😌 Relaxed",     value: "I want something light and relaxing" },
    { label: "😰 Anxious",     value: "I'm feeling anxious and overwhelmed" },
    { label: "🌱 Healing",     value: "I'm healing and need something comforting" },
  ];

  function toggleMoods() {
    const chips = document.getElementById("chips");
    const btn   = document.getElementById("moods-toggle");
    const open  = chips.classList.toggle("open");
    btn.textContent = open ? "🎭 Moods ▴" : "🎭 Moods ▾";
  }

  // Render mood chips
  const chipsEl = document.getElementById("chips");
  CHIPS.forEach(c => {
    const btn = document.createElement("button");
    btn.className = "chip";
    btn.textContent = c.label;
    btn.onclick = () => {
      document.getElementById("mood-input").value = c.value;
      document.querySelectorAll(".chip").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      // close the panel after picking
      document.getElementById("chips").classList.remove("open");
      document.getElementById("moods-toggle").textContent = "🎭 Moods ▾";
    };
    chipsEl.appendChild(btn);
  });

  async function search() {
    const text = document.getElementById("mood-input").value.trim();
    if (!text) return;
    currentText   = text;
    currentOffset = 0;
    await fetchBooks(text, 0);
  }

  async function shuffle() {
    currentOffset += 10;
    await fetchBooks(currentText, currentOffset);
  }

  async function fetchBooks(text, offset) {
    const btn = document.getElementById("search-btn");
    const shuffleBtn = document.getElementById("shuffle-btn");
    btn.disabled = true;
    btn.textContent = "Finding books...";
    if (shuffleBtn) shuffleBtn.disabled = true;
    document.getElementById("error").textContent = "";
    document.getElementById("grid").innerHTML = "";
    document.getElementById("mood-label").innerHTML = "";
    document.getElementById("results-title").innerHTML = "";
    document.getElementById("shuffle-row").style.display = "none";

    try {
      const res = await fetch(`${API}/recommend`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_text: text, top_n: 10, offset }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `HTTP ${res.status}`);
      }
      const data = await res.json();
      currentMood = data.mood;

      document.getElementById("mood-label").innerHTML =
        `Detected mood: <span>${data.mood}</span>`;
      document.getElementById("results-title").innerHTML =
        `<p class="section-title">Recommended for you</p>`;

      data.books.forEach(book => renderCard(book, text, data.mood));
      document.getElementById("shuffle-row").style.display = "flex";
      applyHistoryToCards();
    } catch (e) {
      document.getElementById("error").textContent =
        "Error: " + (e.message || "Unknown error. Check console (F12) for details.");
    } finally {
      btn.disabled = false;
      btn.textContent = "Find Books ✨";
      if (shuffleBtn) shuffleBtn.disabled = false;
    }
  }

  function renderCard(book, userText, mood) {
    const stars = Math.round(book.rating);
    const genre = (book.genre || "General").split(",")[0].trim() || "General";
    const cardId = "card-" + Math.random().toString(36).slice(2);

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-cover" ${book.thumbnail ? `style="background-image:url('${book.thumbnail}')"` : ""}>
        ${book.thumbnail ? "" : "📖"}
      </div>
      <div class="card-body">
        <div class="card-title">${escHtml(book.title)}</div>
        <div class="card-author">${escHtml(book.author)}</div>
        <div>
          <span class="stars">${"★".repeat(Math.min(stars,5))}${"☆".repeat(Math.max(0,5-stars))}</span>
          <span class="rating-num">${book.rating.toFixed(1)}${book.ratings_count > 0 ? ` · ${book.ratings_count.toLocaleString()} ratings` : ""}</span>
        </div>
        <span class="genre-tag">${escHtml(genre)}</span>
        <p class="card-desc">${escHtml(book.description)}</p>
        <div class="explain-box" id="exp-${cardId}"></div>
        <button class="btn-explain" id="btn-${cardId}">✨ Why this book?</button>
        <div class="card-actions">
          <button class="btn-read" id="read-${cardId}">✓ Read</button>
          <button class="btn-skip" id="skip-${cardId}">✗ Not interested</button>
        </div>
      </div>
    `;

    card.querySelector(`#btn-${cardId}`).addEventListener("click", () =>
      explain(cardId, book, userText, mood)
    );
    card.querySelector(`#read-${cardId}`).addEventListener("click", () =>
      markBook(cardId, book, "read")
    );
    card.querySelector(`#skip-${cardId}`).addEventListener("click", () =>
      markBook(cardId, book, "skip")
    );
    document.getElementById("grid").appendChild(card);
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  async function explain(cardId, book, userText, mood) {
    const box = document.getElementById("exp-" + cardId);
    const btn = document.getElementById("btn-" + cardId);

    if (box.style.display === "block") {
      box.style.display = "none";
      btn.textContent = "✨ Why this book?";
      return;
    }
    if (box.textContent) {
      box.style.display = "block";
      btn.textContent = "Hide explanation";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Asking Gemini...";
    try {
      const res = await fetch(`${API}/explain`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ book, user_text: userText, mood }),
      });
      if (!res.ok) throw new Error("explain failed");
      const data = await res.json();
      box.textContent = "✨ " + data.explanation;
      box.style.display = "block";
      btn.textContent = "Hide explanation";
    } catch {
      box.textContent = "Could not generate explanation right now.";
      box.style.display = "block";
      btn.textContent = "Hide explanation";
    } finally {
      btn.disabled = false;
    }
  }

  // Allow Enter key to search
  document.getElementById("mood-input").addEventListener("keydown", e => {
    if (e.key === "Enter") search();
  });

  // ── Lucky pick ──────────────────────────────────────────────
  let _luckyBook = null;

  function feelingLucky() {
    // Need results to pick from
    const cards = document.querySelectorAll(".card");
    if (!cards.length) {
      // No results yet — run a search first with current input or a random mood
      const text = document.getElementById("mood-input").value.trim()
        || "I'm not sure what I want to read";
      document.getElementById("mood-input").value = text;
      search().then(() => _pickLucky());
      return;
    }
    _pickLucky();
  }

  function _pickLucky() {
    if (!currentText) return;
    // Pick a random book from the current result pool via a random offset
    const randomOffset = Math.floor(Math.random() * 50);
    fetch(`${API}/recommend`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_text: currentText, top_n: 10, offset: randomOffset }),
    })
    .then(r => r.json())
    .then(data => {
      const books = data.books;
      if (!books || !books.length) return;
      _luckyBook = books[Math.floor(Math.random() * books.length)];
      _showModal(_luckyBook);
    })
    .catch(() => {});
  }

  function _showModal(book) {
    const stars = Math.round(book.rating);
    document.getElementById("modal-title").textContent  = book.title;
    document.getElementById("modal-author").textContent = "by " + book.author;
    document.getElementById("modal-genre").textContent  = book.genre || "General";
    document.getElementById("modal-stars").innerHTML    =
      "★".repeat(Math.min(stars,5)) + "☆".repeat(Math.max(0,5-stars)) +
      ` <span style="color:#a7a9be;font-size:0.8rem">${book.rating.toFixed(1)}</span>`;
    document.getElementById("modal-desc").textContent   = book.description;
    document.getElementById("modal-explain").style.display = "none";
    document.getElementById("modal-explain").textContent   = "";
    document.getElementById("modal-explain-btn").textContent = "✨ Why this book?";
    document.getElementById("modal-explain-btn").disabled   = false;

    const cover = document.getElementById("modal-cover");
    if (book.thumbnail) {
      cover.style.backgroundImage = `url('${book.thumbnail}')`;
      cover.textContent = "";
    } else {
      cover.style.backgroundImage = "";
      cover.textContent = "📖";
    }
    document.getElementById("lucky-modal").classList.add("open");
  }

  function closeModal() {
    document.getElementById("lucky-modal").classList.remove("open");
  }

  async function modalExplain() {
    if (!_luckyBook) return;
    const btn = document.getElementById("modal-explain-btn");
    const box = document.getElementById("modal-explain");
    if (box.style.display === "block") {
      box.style.display = "none";
      btn.textContent = "✨ Why this book?";
      return;
    }
    if (box.textContent) { box.style.display = "block"; return; }
    btn.disabled = true;
    btn.textContent = "Asking Gemini...";
    try {
      const res = await fetch(`${API}/explain`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ book: _luckyBook, user_text: currentText, mood: currentMood }),
      });
      const data = await res.json();
      box.textContent = "✨ " + data.explanation;
      box.style.display = "block";
      btn.textContent = "Hide explanation";
    } catch {
      box.textContent = "Could not generate explanation.";
      box.style.display = "block";
    } finally {
      btn.disabled = false;
    }
  }

  // Close modal on overlay click
  document.getElementById("lucky-modal").addEventListener("click", e => {
    if (e.target === document.getElementById("lucky-modal")) closeModal();
  });

  // ── Reading History ─────────────────────────────────────────
  const HISTORY_KEY = "bookHistory";
  let _historyTab = "read";

  function getHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || { read: [], skip: [] }; }
    catch { return { read: [], skip: [] }; }
  }

  function saveHistory(h) {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
  }

  function isInHistory(title, author) {
    const h = getHistory();
    return [...h.read, ...h.skip].some(b => b.title === title && b.author === author);
  }

  function markBook(cardId, book, type) {
    const h = getHistory();
    if (!h[type].some(b => b.title === book.title && b.author === book.author)) {
      h[type].push({ title: book.title, author: book.author, thumbnail: book.thumbnail, genre: book.genre });
      saveHistory(h);
    }
    // Dim the card
    const readBtn = document.getElementById("read-" + cardId);
    const skipBtn = document.getElementById("skip-" + cardId);
    if (readBtn) { readBtn.classList.add("done"); readBtn.disabled = true; }
    if (skipBtn) { skipBtn.classList.add("done"); skipBtn.disabled = true; }
    const card = readBtn?.closest(".card");
    if (card) card.style.opacity = "0.45";
    renderHistoryList();
  }

  function toggleHistory() {
    const panel = document.getElementById("history-panel");
    panel.classList.toggle("open");
    if (panel.classList.contains("open")) renderHistoryList();
  }

  function switchHistoryTab(tab) {
    _historyTab = tab;
    document.querySelectorAll(".history-tab").forEach(t => {
      t.classList.toggle("active", t.dataset.tab === tab);
    });
    renderHistoryList();
  }

  function renderHistoryList() {
    const h = getHistory();
    const list = document.getElementById("history-list");
    const items = h[_historyTab] || [];
    if (!items.length) {
      list.innerHTML = `<div class="history-empty">Nothing here yet</div>`;
      return;
    }
    list.innerHTML = items.slice().reverse().map((b, i) => `
      <div class="history-item">
        <div class="history-item-cover" ${b.thumbnail ? `style="background-image:url('${b.thumbnail}')"` : ""}>
          ${b.thumbnail ? "" : "📖"}
        </div>
        <div class="history-item-info">
          <div class="history-item-title">${escHtml(b.title)}</div>
          <div class="history-item-author">${escHtml(b.author)}</div>
        </div>
        <button class="btn-remove-history" onclick="removeFromHistory('${_historyTab}', ${items.length - 1 - i})">✕</button>
      </div>
    `).join("");
  }

  function removeFromHistory(type, idx) {
    const h = getHistory();
    h[type].splice(idx, 1);
    saveHistory(h);
    renderHistoryList();
  }

  function clearHistory() {
    const h = getHistory();
    h[_historyTab] = [];
    saveHistory(h);
    renderHistoryList();
  }

  // On page load, mark already-read books when cards render
  function applyHistoryToCards() {
    const h = getHistory();
    const all = [...h.read, ...h.skip];
    document.querySelectorAll(".card").forEach(card => {
      const title  = card.querySelector(".card-title")?.textContent;
      const author = card.querySelector(".card-author")?.textContent;
      if (all.some(b => b.title === title && b.author === author)) {
        card.style.opacity = "0.45";
      }
    });
  }
</script>
</body>

<!-- History panel -->
<button class="history-toggle" onclick="toggleHistory()">📚 History</button>
<div class="history-panel" id="history-panel">
  <div class="history-header">
    <h3>Reading History</h3>
    <button class="btn-clear-history" onclick="clearHistory()">Clear all</button>
  </div>
  <div class="history-tabs">
    <button class="history-tab active" data-tab="read" onclick="switchHistoryTab('read')">Read</button>
    <button class="history-tab" data-tab="skip" onclick="switchHistoryTab('skip')">Not interested</button>
  </div>
  <div class="history-list" id="history-list"></div>
</div>

<!-- Lucky pick modal -->
<div class="modal-overlay" id="lucky-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-cover" id="modal-cover">📖</div>
    <div class="modal-title"  id="modal-title"></div>
    <div class="modal-author" id="modal-author"></div>
    <div class="modal-genre"  id="modal-genre"></div>
    <div class="modal-stars"  id="modal-stars"></div>
    <div class="modal-desc"   id="modal-desc"></div>
    <div class="modal-explain" id="modal-explain"></div>
    <div class="modal-actions">
      <button class="btn-shuffle" id="modal-explain-btn" onclick="modalExplain()">✨ Why this book?</button>
      <button class="btn-shuffle" onclick="feelingLucky()">🎲 Pick another</button>
    </div>
  </div>
</div>
</html>
